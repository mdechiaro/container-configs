---
name: work
description: work environment using fedora
config:
  environment.PIPEWIRE_REMOTE: /run/mount/pipewire
  environment.PULSE_SERVER: unix:/run/mount/pulse
  environment.WAYLAND_DISPLAY: /run/mount/wayland
  user.user-data: |
    #cloud-config
    packages:
    - aspell
    - bash-completion
    - firefox
    - freerdp
    - git
    - libreoffice
    - lynx
    - mutt
    - nnn
    - openconnect
    - pinentry
    - python3
    - rclone
    - rsync
    - tmux
    - vim
    - wget
    - xdg-utils
    power_state:
      delay: now
      mode: reboot
      timeout: 30
      condition: true
    runcmd:
    - mkdir -p /etc/firefox/policies
    - |
      curl -L https://github.com/mdechiaro/firefox-policies/raw/refs/heads/main/policies.json \
        -o /etc/firefox/policies/policies.json
    timezone: America/Chicago
    users:
    - name: user
      shell: /bin/bash
      sudo: ALL=(ALL) NOPASSWD:ALL
devices:
  gpu:
    gid: '1000'
    type: gpu
    uid: '1000'
  network:
    name: eth0
    network: incusbr0
    type: nic
  pipewire:
    bind: container
    connect: unix:/run/user/1000/pipewire-0
    gid: '1000'
    listen: unix:/run/mount/pipewire
    security.gid: '1000'
    security.uid: '1000'
    type: proxy
    uid: '1000'
  pulseserver:
    bind: container
    connect: unix:/run/user/1000/pulse/native
    gid: '1000'
    listen: unix:/run/mount/pulse
    security.gid: '1000'
    security.uid: '1000'
    type: proxy
    uid: '1000'
  storage:
    path: /
    pool: default
    type: disk
  wayland:
    bind: container
    connect: unix:/run/user/1000/wayland-0
    gid: '1000'
    listen: unix:/run/mount/wayland
    security.gid: '1000'
    security.uid: '1000'
    type: proxy
    uid: '1000'
used_by: []
